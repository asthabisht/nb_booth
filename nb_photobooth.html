  NEW BALANCE — Event Photobooth (macOS + Mitsubishi CP-D70DW/D707DW)
  Flow:  START -> live camera + 5·4·3·2·1 countdown -> review (RETAKE / NEXT)
         -> done (SCAN TO DOWNLOAD: QR + PRINT + START AGAIN) -> print -> auto-reset home.

  UI: solid white, black New Balance logo + black type.
  PRINT: the captured photo is composited into a black polaroid frame with the white New Balance
         logo in the bottom band, rotated onto the CP-D70's landscape 4x6 sheet, borderless.
         Run via "Launch NB Photobooth.command" (local server + Chrome --kiosk --kiosk-printing).
  QR: photo POSTed to UPLOAD_ENDPOINT (Netlify fn -> Cloudflare R2); returned {url} drives the QR.
-->

<style>

  :root{
    --blue:#000000;        /* New Balance black (accent var kept as --blue) */
    --white:#ffffff;
    --ink:#000000;
    --serif:'Helvetica Neue',Helvetica,Arial,sans-serif;   /* headlines: heavy sans */
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
    /* polaroid photo-window geometry (fractions of the 4x6 print) */
    --win-l:5%; --win-t:3.33%; --win-w:90%; --win-h:88.6%;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%}
  body{background:#000;font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}

  /* Portrait stage — solid white, fills a 1080x1920 (9:16) kiosk screen */
  .stage{position:relative;width:min(100vw,calc(100dvh*0.5625));height:min(100dvh,calc(100vw/0.5625));
    background:var(--white);overflow:hidden;isolation:isolate;container-type:size}

  .screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;
    padding:clamp(18px,3.2cqh,54px) clamp(28px,6cqw,66px);opacity:0;transition:opacity .45s}
  .screen.active{display:flex;opacity:1;animation:fadeUp .55s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* Header logo (New Balance, black) — same on every screen */
  .wordmark{flex:none;font-family:var(--serif);font-weight:600;color:var(--blue);text-align:center;
    font-size:clamp(24px,4cqh,44px);letter-spacing:.005em;line-height:1;white-space:nowrap;
    margin-bottom:clamp(6px,1.4cqh,18px)}
  .wordmark img{display:block;height:clamp(40px,6cqh,78px);width:auto;margin:0 auto}

  .spacer{flex:1}

  /* BEGIN */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center}
  .hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(56px,11cqh,128px);line-height:.92;letter-spacing:-.03em;color:var(--ink)}
  .hero .btn{margin-top:clamp(30px,5cqh,64px)}

  /* Buttons — rounded pills */
  .btn{width:100%;max-width:500px;padding:0.98em 1.6em;border-radius:999px;border:2px solid var(--blue);
    background:transparent;color:var(--blue);font-family:var(--sans);font-weight:700;letter-spacing:.2em;
    text-indent:.2em;font-size:clamp(14px,1.85cqh,18px);text-transform:uppercase;cursor:pointer;transition:.2s}
  .btn:hover,.btn:focus-visible{background:var(--blue);color:var(--white);outline:none}
  .btn.primary{background:var(--blue);color:var(--white);box-shadow:0 10px 26px rgba(0,0,0,.22)}
  .btn.primary:hover{background:transparent;color:var(--blue)}
  .btn-row{display:flex;gap:16px;width:100%;max-width:660px;margin-bottom:clamp(14px,3cqh,46px)}
  .btn-row .btn{max-width:none}
  .btn-stack{display:flex;flex-direction:column;gap:13px;width:100%;max-width:500px;align-items:center;margin-bottom:clamp(14px,3cqh,46px)}

  /* Shared photo frame — same shape as the black polaroid's photo window (1068x1390) */
  .frame{position:relative;flex:none;height:56cqh;width:auto;max-width:94%;aspect-ratio:1068/1390;
    border-radius:8px;border:1px solid rgba(0,0,0,.18);overflow:hidden;background:#eef0f2;
    display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.18);margin:0 auto}
  #live{width:100%;height:100%;object-fit:cover}   /* un-mirrored: preview matches the print */
  #reviewImg{width:100%;height:100%;object-fit:cover}
  .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .count span{font-family:var(--serif);font-weight:600;font-size:min(38cqh,44cqw);line-height:1;color:#fff;
    text-shadow:0 10px 50px rgba(0,0,0,.55);animation:pop .9s ease}
  @keyframes pop{0%{transform:scale(.5);opacity:0}30%{opacity:1}100%{transform:scale(1.22);opacity:0}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flash .5s ease}
  @keyframes flash{0%{opacity:0}8%{opacity:.95}100%{opacity:0}}
  .cap-hint{flex:none;min-height:1.2em;font-weight:700;letter-spacing:.24em;font-size:clamp(11px,1.5cqh,14px);
    color:var(--blue);text-transform:uppercase}

  .head-title{flex:none;text-align:center;font-family:var(--serif);font-weight:600;
    font-size:clamp(30px,4.6cqh,52px);color:var(--ink)}
  .done-kicker{font-family:var(--sans);font-weight:700;letter-spacing:.42em;text-indent:.42em;
    font-size:clamp(11px,1.4cqh,14px);color:var(--blue);opacity:.75;text-transform:uppercase;margin-bottom:.45em;text-align:center}
  .done-title{font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.6cqh,52px);color:var(--ink);margin-bottom:.5em;text-align:center}

  /* DONE / PRINT: polaroid = photo BEHIND + the black frame artwork (window punched
     transparent) laid ON TOP. */
  .done-photo{height:34cqh;aspect-ratio:2/3;display:block;margin:0 auto;border-radius:2px;box-shadow:0 16px 40px rgba(0,0,0,.28)}

  .qrbox{background:#fff;padding:14px;border-radius:8px;width:min(40%,200px);margin:clamp(10px,1.6cqh,18px) auto 0;
    display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.14);box-shadow:0 10px 28px rgba(0,0,0,.16)}
  .qrbox canvas,.qrbox img{width:100%!important;height:auto!important;display:block;image-rendering:pixelated}
  .qr-sub{text-align:center;font-family:var(--sans);font-weight:700;letter-spacing:.2em;
    font-size:clamp(11px,1.5cqh,14px);color:var(--blue);opacity:.75;text-transform:uppercase;margin-top:clamp(10px,1.6cqh,16px)}

  /* PRINT overlay (on-screen, while printing) */
  .print-overlay{position:absolute;inset:0;z-index:5;background:var(--white);display:none;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.1em;padding:10%}
  .print-overlay.active{display:flex}
  .print-overlay h2{font-family:var(--serif);font-weight:600;font-size:clamp(34px,6cqh,64px);color:var(--ink)}
  .print-overlay p{font-family:var(--sans);font-weight:700;color:var(--blue);opacity:.75;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(12px,1.5cqh,15px)}
  .spin{width:46px;height:46px;border:3px solid rgba(0,0,0,.22);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- PRINT: composite the photo into the black polaroid frame, borderless 4x6 ---- */
  .print-only{display:none}
  @media print{
    /* the CP-D70's 4x6 sheet is LANDSCAPE (158x104mm incl. bleed) — print the rotated polaroid
       edge to edge on it; a portrait page got laid sideways, cropped, with a white band */
    @page{size:158mm 104mm;margin:0}
    html,body{height:auto;margin:0;padding:0;background:#fff;display:block;overflow:visible}
    .stage,.print-overlay{display:none!important}
    .print-only{display:block;width:158mm;height:104mm;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    /* printer correction (measured from edge tests, 4 Nov 2026): this CP-D70 lands every print
       ~2mm toward the sheet's top edge, tilted ~0.5° clockwise — nudge it back. If the printer is
       serviced or swapped, set both to 0 and re-run the edge test. */
    .print-only img{display:block;width:100%;height:100%;object-fit:cover;
      transform:translateY(2mm) rotate(-0.5deg);transform-origin:center}
  }
</style>

<div class="stage" id="stage">

  <!-- 1 · BEGIN -->
  <section class="screen active" id="s-begin">
    <div class="wordmark"><img src="assets/nb_logo_black.png" alt="New Balance"></div>
    <div class="spacer"></div>
    <div class="hero">
      <h1>Snap it.<br>Keep it.</h1>
      <button class="btn primary" id="btnStart">Tap to start</button>
    </div>
    <div class="spacer"></div>
  </section>

  <!-- 2 · CAPTURE -->
  <section class="screen" id="s-capture">
    <div class="wordmark"><img src="assets/nb_logo_black.png" alt="New Balance"></div>
    <div class="spacer"></div>
    <div class="frame">
      <video id="live" autoplay playsinline muted></video>
      <div class="count" id="count" hidden><span id="countNum">5</span></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="spacer"></div>
    <div class="cap-hint" id="capHint"></div>
  </section>

  <!-- 3 · REVIEW -->
  <section class="screen" id="s-review">
    <div class="wordmark"><img src="assets/nb_logo_black.png" alt="New Balance"></div>
    <div class="head-title" style="margin-top:.2em">Looking good?</div>
    <div class="spacer"></div>
    <div class="frame"><img id="reviewImg" alt="Your photo"></div>
    <div class="spacer"></div>
    <div class="btn-row">
      <button class="btn" id="btnRetake">Retake</button>
      <button class="btn primary" id="btnNext">Next</button>
    </div>
  </section>

  <!-- 4 · DONE -->
  <section class="screen" id="s-done">
    <div class="wordmark"><img src="assets/nb_logo_black.png" alt="New Balance"></div>
    <div class="spacer"></div>
    <div class="done-kicker">Your photo is ready</div>
    <div class="done-title">Scan to download</div>
    <img class="done-photo" id="donePreview" alt="New Balance polaroid">
    <div class="qrbox" id="qrbox"></div>
    <div class="qr-sub" id="qrSub">Point your camera at the code</div>
    <div class="spacer"></div>
    <div class="btn-stack">
      <button class="btn primary" id="btnPrint">Print my photo</button>
      <button class="btn" id="btnAgain">Start again</button>
    </div>
  </section>

  <!-- PRINT overlay -->
  <div class="print-overlay" id="printOverlay">
    <div class="spin"></div>
    <h2>Printing…</h2>
    <p id="printMsg">Please collect your photo</p>
  </div>

</div>

<!-- Full-bleed print target — the black polaroid with the photo composited in -->
<div class="print-only" id="printOnly"><img id="printImg" alt=""></div>

<script>
(function(){
  "use strict";

  var CONFIG = {
    UPLOAD_ENDPOINT: "/.netlify/functions/upload",
    QR_FALLBACK_URL: "https://www.newbalance.com",
    COUNTDOWN_FROM: 5,
    PRINT_SECONDS: 18,
    CAPTURE_W: 1068, CAPTURE_H: 1390            // = the black frame's photo window
  };

  var $ = function(id){ return document.getElementById(id); };
  var screens = { begin:$("s-begin"), capture:$("s-capture"), review:$("s-review"), done:$("s-done") };
  var stream = null, lastJpeg = null, framedJpeg = null, timers = [];
  // preload the polaroid overlay so we can flatten photo+frame into one image
  var overlayImg = new Image(); overlayImg.src = "assets/polaroid_overlay_nb.png";

  function clearTimers(){ timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = []; }
  function after(ms, fn){ var t = setTimeout(fn, ms); timers.push(t); return t; }
  function go(name){ Object.keys(screens).forEach(function(k){ screens[k].classList.toggle("active", k===name); }); }

  async function initCam(){
    if (stream) return true;
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"user", width:{ideal:1440}, height:{ideal:1920} }, audio:false
      });
      $("live").srcObject = stream; return true;
    }catch(e){ $("capHint").textContent = "Camera unavailable — check permissions"; return false; }
  }
  function stopCam(){ if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; } }

  async function startCapture(){
    go("capture"); $("capHint").textContent = "";
    var ok = await initCam(); if(!ok) return;
    var n = CONFIG.COUNTDOWN_FROM, countEl = $("count"), numEl = $("countNum");
    countEl.hidden = false; numEl.textContent = n;
    numEl.style.animation = "none"; void numEl.offsetWidth; numEl.style.animation = "";
    var iv = setInterval(function(){
      n--;
      if(n <= 0){ clearInterval(iv); countEl.hidden = true; doSnap(); return; }
      numEl.textContent = n;
      numEl.style.animation = "none"; void numEl.offsetWidth; numEl.style.animation = "";
    }, 1000);
    timers.push(iv);
  }

  function doSnap(){
    var fl = $("flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
    var v = $("live"), cw = CONFIG.CAPTURE_W, ch = CONFIG.CAPTURE_H;
    var c = document.createElement("canvas"); c.width = cw; c.height = ch;
    var ctx = c.getContext("2d");
    var vw = v.videoWidth || cw, vh = v.videoHeight || ch;
    var scale = Math.max(cw/vw, ch/vh), dw = vw*scale, dh = vh*scale;
    var dx = (cw-dw)/2, dy = (ch-dh)/2;
    ctx.drawImage(v, dx, dy, dw, dh);   // un-mirrored (normal camera orientation)
    lastJpeg = c.toDataURL("image/jpeg", 0.92);
    $("reviewImg").src = lastJpeg;
    after(180, function(){ go("review"); });
  }

  function renderQR(text){
    var box = $("qrbox"); box.innerHTML = "";
    var cv = document.createElement("canvas"); box.appendChild(cv);
    try{
      QRCode.toCanvas(cv, text, { width:600, margin:1, color:{ dark:"#000000", light:"#ffffff" }, errorCorrectionLevel:"M" }, function(err){
        if(err){ box.innerHTML = '<div style="color:#000000;font-size:12px;padding:8px;text-align:center">'+text+'</div>'; }
      });
    }catch(e){ box.innerHTML = '<div style="color:#000000;font-size:12px;padding:8px;text-align:center">'+text+'</div>'; }
  }

  // flatten captured photo + polaroid overlay into ONE image (bulletproof for silent printing)
  function composePolaroid(){
    return new Promise(function(resolve){
      var W=1200, H=1800, c=document.createElement("canvas"); c.width=W; c.height=H;
      var ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
      var photo=new Image();
      photo.onload=function(){
        // photo fills the frame's window (cover); the black frame + logo overlay sits on top
        var X=66, Y=80, WW=1068, WH=1390;
        var s=Math.max(WW/photo.width, WH/photo.height), dw=photo.width*s, dh=photo.height*s;
        ctx.drawImage(photo, X+(WW-dw)/2, Y+(WH-dh)/2, dw, dh);
        function over(){ ctx.drawImage(overlayImg,0,0,W,H); resolve(c.toDataURL("image/jpeg",0.92)); }
        if(overlayImg.complete && overlayImg.naturalWidth){ over(); } else { overlayImg.onload=over; }
      };
      photo.src=lastJpeg;
    });
  }

  // turn the portrait polaroid 90° clockwise to sit on the printer's landscape 4x6 sheet
  function rotateForPrint(src){
    return new Promise(function(resolve){
      var img=new Image();
      img.onload=function(){
        var W=img.height, H=img.width, c=document.createElement("canvas"); c.width=W; c.height=H;
        var ctx=c.getContext("2d"); ctx.translate(W,0); ctx.rotate(Math.PI/2); ctx.drawImage(img,0,0);
        resolve(c.toDataURL("image/jpeg",0.92));
      };
      img.src=src;
    });
  }

  async function enterDone(){
    stopCam(); go("done");
    $("qrSub").textContent = "Preparing your photo…";
    framedJpeg = await composePolaroid();           // one flattened polaroid image
    $("donePreview").src = framedJpeg; $("printImg").src = await rotateForPrint(framedJpeg);
    renderQR(CONFIG.QR_FALLBACK_URL);
    var url = CONFIG.QR_FALLBACK_URL;
    try{
      var b64 = framedJpeg.split(",")[1];
      var res = await fetch(CONFIG.UPLOAD_ENDPOINT, { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ imageBase64:b64, name:"newbalance" }) });
      if(res.ok){ var data = await res.json(); if(data && data.url) url = data.url; }
    }catch(e){}
    renderQR(url);
    $("qrSub").textContent = "Point your camera at the code";
  }

  // wait until the print image is fully decoded, THEN print — fixes kiosk-printing racing ahead
  async function printPhoto(){
    if(!framedJpeg) return;                          // nothing to print until a photo exists
    $("printOverlay").classList.add("active");
    var img = $("printImg");
    try{ if(img && img.decode){ await img.decode(); } }catch(e){}
    // two frames to guarantee it's painted, then fire the silent print
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ try{ window.print(); }catch(e){} }); });
    after(CONFIG.PRINT_SECONDS*1000, resetHome);
  }

  function resetHome(){
    clearTimers(); stopCam(); lastJpeg = null; framedJpeg = null;
    $("printOverlay").classList.remove("active");
    $("reviewImg").removeAttribute("src"); $("donePreview").removeAttribute("src"); $("printImg").removeAttribute("src");
    $("qrbox").innerHTML = ""; $("capHint").textContent = "";
    go("begin");
  }

  $("btnStart").addEventListener("click", startCapture);
  $("btnRetake").addEventListener("click", startCapture);
  $("btnNext").addEventListener("click", enterDone);
  $("btnPrint").addEventListener("click", printPhoto);
  $("btnAgain").addEventListener("click", resetHome);
})();
</script>
